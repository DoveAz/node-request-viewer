<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Node Network Monitor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.11.1/styles/github-dark.min.css" />
    <style>
      :root { color-scheme: dark; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; } body { margin: 0; background: #17191d; color: #d6d9df; overflow: hidden; }
      header { height: 48px; display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #30343b; background: #202329; }
      header strong { font-size: 14px; margin-right: 10px; } button, select, input { color: #d6d9df; background: #2a2e35; border: 1px solid #454b55; border-radius: 4px; padding: 6px 9px; }
      button { cursor: pointer; } input { width: 270px; } #status { color: #72d28b; } #count { color: #9299a5; margin-right: auto; }
      #filter-bar { height: 38px; display: flex; align-items: center; gap: 5px; padding: 5px 10px; overflow-x: auto; background: #1d2025; border-bottom: 1px solid #30343b; white-space: nowrap; }
      .filter { border: 0; border-radius: 3px; padding: 5px 8px; color: #9ea5b1; background: transparent; } .filter:hover, .filter.active { color: #fff; background: #3b414a; }
      .filter-separator { width: 1px; height: 20px; margin: 0 4px; background: #444a53; }
      main { display: grid; grid-template-columns: minmax(560px, 50%) 1fr; height: calc(100vh - 86px); }
      #list { min-height: 0; border-right: 1px solid #30343b; } #list-head { height: 34px; position: sticky; top: 0; z-index: 1; display: grid; grid-template-columns: 38px 30px 62px minmax(180px, 1fr) 105px 54px 62px; padding: 8px 10px; color: #8d95a3; background: #202329; border-bottom: 1px solid #30343b; }
      #list-viewport { height: calc(100% - 34px); overflow: auto; } #list-spacer { position: relative; width: 100%; } #list-rows { position: absolute; left: 0; top: 0; width: 100%; }
      .row { height: 38px; display: grid; grid-template-columns: 38px 30px 62px minmax(180px, 1fr) 105px 54px 62px; gap: 0; align-items: center; padding: 0 10px; border-bottom: 1px solid #282c32; cursor: pointer; }
      .row:hover, .selected { background: #29384b; } .method { font-weight: 700; color: #73b7ff; } .status { font-weight: 600; color: #71d28a; }
      .status.error { color: #f07d7d; } .url { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .duration { color: #8d95a3; text-align: right; }
      .method.get { color: #73b7ff; } .method.post { color: #d9b36c; } .method.put, .method.patch { color: #c5a0ff; } .method.delete { color: #f07d7d; }
      .status.pending { color: #c5a0ff; } .status.s2 { color: #71d28a; } .status.s3 { color: #e1c36b; } .status.s4, .status.s5, .status.error { color: #f07d7d; }
      .content-type { min-width: 0; color: #aeb5c0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .row-id, .request-icon { color: #8d95a3; } .request-icon { text-align: center; font-size: 13px; } .row-id { text-align: right; padding-right: 8px; }
      #detail { min-height: 0; display: grid; grid-template-rows: minmax(230px, 1fr) minmax(230px, 1fr); background: #1b1e23; } #empty { padding: 44px; color: #8d95a3; text-align: center; } .detail-pane { min-height: 0; overflow: auto; } .detail-top { border-bottom: 1px solid #444a53; } .detail-head { padding: 12px 18px 10px; border-bottom: 1px solid #30343b; }
      .detail-head h2 { margin: 0 0 7px; font-size: 14px; font-weight: 600; overflow-wrap: anywhere; } .detail-head p { color: #8d95a3; margin: 0; } .detail-actions { float: right; margin-left: 12px; }
      .tabs { display: flex; gap: 4px; padding: 8px 18px 0; border-bottom: 1px solid #30343b; overflow-x: auto; } .tab { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; color: #9299a5; white-space: nowrap; }
      .tab.active { color: #fff; border-bottom-color: #5aa8ff; } .tab-panel { padding: 14px 18px; } .kv { display: grid; grid-template-columns: 150px 1fr; border-bottom: 1px solid #292d34; padding: 7px 0; }
      .kv label { color: #8d95a3; } pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #121417; padding: 12px; border: 1px solid #2d3239; border-radius: 4px; margin: 0; max-height: 55vh; overflow: auto; }
      .section-title { color: #aeb5c0; font-weight: 600; margin: 0 0 8px; } .muted { color: #8d95a3; }
      .body-meta { display: flex; gap: 8px; align-items: center; margin: 0 0 8px; color: #9299a5; } .badge { background: #303943; border: 1px solid #46515f; border-radius: 10px; padding: 2px 8px; color: #c8d9ea; }
      .hljs { color: #c9d1d9; background: #121417; } .hljs-keyword, .hljs-selector-tag, .hljs-literal { color: #ff7b72; } .hljs-string, .hljs-attr { color: #a5d6ff; } .hljs-number { color: #79c0ff; } .hljs-title, .hljs-name { color: #d2a8ff; } .hljs-comment { color: #8b949e; }
      .response-image { display: block; max-width: 100%; max-height: 520px; object-fit: contain; background: #0d0f12; border: 1px solid #2d3239; border-radius: 4px; padding: 8px; }
      /* Glass workspace theme */
      body { background: radial-gradient(circle at 10% -10%, rgba(70, 104, 190, .24), transparent 34%), radial-gradient(circle at 92% 0%, rgba(130, 73, 185, .2), transparent 32%), #0e1117; }
      body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: linear-gradient(120deg, rgba(255,255,255,.035), transparent 38%, rgba(122,146,255,.025)); }
      header, #filter-bar, #list-head, .detail-head, .tabs { background: rgba(24, 29, 39, .72); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); }
      header { border-color: rgba(162, 181, 255, .16); box-shadow: 0 10px 30px rgba(0,0,0,.16); }
      header strong { color: #f3f6ff; letter-spacing: .02em; }
      #filter-bar { border-color: rgba(162, 181, 255, .12); }
      .filter { color: #9ca8bd; transition: color .15s ease, background .15s ease, box-shadow .15s ease; }
      .filter:hover, .filter.active { color: #fff; background: linear-gradient(135deg, rgba(91, 139, 255, .34), rgba(137, 91, 215, .3)); box-shadow: inset 0 0 0 1px rgba(166, 189, 255, .2), 0 4px 16px rgba(63, 98, 195, .18); }
      input, select, button { border-color: rgba(160, 177, 226, .2); background: rgba(17, 21, 29, .62); box-shadow: inset 0 1px 0 rgba(255,255,255,.035); }
      input:focus, select:focus { outline: none; border-color: rgba(111, 161, 255, .75); box-shadow: 0 0 0 3px rgba(83, 132, 255, .16); }
      #list, #detail { background: rgba(14, 18, 26, .54); }
      #list-head { color: #98a6be; border-color: rgba(162, 181, 255, .13); }
      .row { border-color: rgba(148, 164, 202, .1); transition: background .14s ease, box-shadow .14s ease; }
      .row:hover { background: linear-gradient(90deg, rgba(68, 105, 180, .2), rgba(99, 73, 160, .12)); }
      .row.selected { background: linear-gradient(90deg, rgba(76, 128, 235, .34), rgba(116, 75, 185, .22)); box-shadow: inset 3px 0 0 #74a7ff, inset 0 1px 0 rgba(255,255,255,.06); }
      .request-icon { color: #9ebcff; }
      #detail { background: rgba(14, 18, 26, .42); }
      .detail-pane { background: rgba(26, 31, 42, .32); }
      .detail-top { border-color: rgba(162, 181, 255, .2); }
      .detail-head { border-color: rgba(162, 181, 255, .13); }
      .detail-head h2 { color: #f0f4ff; }
      .tabs { border-color: rgba(162, 181, 255, .12); }
      .tab { color: #98a5bb; transition: color .15s ease, background .15s ease, border-color .15s ease; }
      .tab:hover { color: #e9efff; background: rgba(114, 151, 238, .1); }
      .tab.active { color: #fff; border-bottom-color: #72a7ff; text-shadow: 0 0 14px rgba(114, 167, 255, .45); }
      .kv { border-color: rgba(148, 164, 202, .11); }
      pre, .hljs { background: rgba(8, 11, 16, .7) !important; border-color: rgba(151, 169, 221, .16); box-shadow: inset 0 1px 12px rgba(0,0,0,.16); }
      .badge { background: linear-gradient(135deg, rgba(83, 126, 213, .38), rgba(114, 77, 173, .3)); border-color: rgba(157, 183, 255, .3); box-shadow: 0 3px 12px rgba(73, 104, 190, .16); }
      .detail-actions { color: #dce7ff; background: linear-gradient(135deg, rgba(83, 132, 245, .48), rgba(122, 78, 184, .42)); border-color: rgba(175, 200, 255, .35); }
      .detail-actions:hover { filter: brightness(1.16); }
      ::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-track { background: rgba(8, 11, 16, .25); } ::-webkit-scrollbar-thumb { background: rgba(130, 151, 196, .3); border: 2px solid transparent; background-clip: padding-box; border-radius: 999px; } ::-webkit-scrollbar-thumb:hover { background: rgba(143, 169, 229, .52); background-clip: padding-box; }
    </style>
  </head>
  <body>
    <header><strong>Network</strong><span id="status">连接中…</span><input id="search" placeholder="Filter requests…" /><select id="method"><option value="">All methods</option><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option><option>HEAD</option><option>OPTIONS</option><option>CONNECT</option><option>TRACE</option></select><span id="count">0 requests</span><button id="clear">Clear</button><button id="export">Export JSON</button></header>
    <nav id="filter-bar"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="http">HTTP</button><button class="filter" data-filter="https">HTTPS</button><button class="filter" data-filter="websocket">WebSocket</button><button class="filter" data-filter="json">JSON</button><button class="filter" data-filter="xml">XML</button><button class="filter" data-filter="text">Text</button><button class="filter" data-filter="html">HTML</button><button class="filter" data-filter="javascript">JS</button><button class="filter" data-filter="image">Images</button><button class="filter" data-filter="binary">Binary</button><span class="filter-separator"></span><button class="filter" data-filter="1xx">1xx</button><button class="filter" data-filter="2xx">2xx</button><button class="filter" data-filter="3xx">3xx</button><button class="filter" data-filter="4xx">4xx</button><button class="filter" data-filter="5xx">5xx</button></nav>
    <main><section id="list"><div id="list-head"><span>ID</span><span>Icon</span><span>Method</span><span>URL</span><span>Response Type</span><span>Status</span><span>Time</span></div><div id="list-viewport"><div id="list-spacer"><div id="list-rows"></div></div></div></section><section id="detail"><div id="empty">Select a request to inspect its details</div></section></main>
    <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.11.1/highlight.min.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
